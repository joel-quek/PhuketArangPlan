<!DOCTYPE html>
<html>
<head>
  <title>Simple Voting Form</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 30px auto; padding: 20px; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; }
    button { cursor: pointer; }
    .card { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; }
    .option { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0; }
    .option button { width: auto; }
    .admin { background: #f7f7f7; }
    h1, h2 { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h1>Simple Voting Form</h1>

  <div class="card">
    <h2>Tally</h2>
    <div id="tally">Loading...</div>
  </div>

  <div class="card admin">
    <h2>Create Question</h2>
    <input id="questionInput" placeholder="Enter question">

    <h3>Options</h3>
    <div id="optionsBox"></div>

    <input id="optionInput" placeholder="Enter option">
    <button onclick="addOption()">Add Option</button>
    <button onclick="saveQuestion()">Save Question</button>
  </div>

  <div id="questions"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      doc,
      updateDoc,
      increment,
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWhhePl8hpHV12uwr0-4LWmuP1_CIrqYJI",
      authDomain: "phuket-arang.firebaseapp.com",
      projectId: "phuket-arang",
      storageBucket: "phuket-arang.firebasestorage.app",
      messagingSenderId: "352587072367",
      appId: "1:352587072367:web:62376cc321b84f57da5e9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let tempOptions = [];

    window.addOption = function () {
      const input = document.getElementById("optionInput");
      const optionText = input.value.trim();

      if (!optionText) return alert("Enter an option first.");

      tempOptions.push({
        text: optionText,
        votes: 0
      });

      input.value = "";
      renderTempOptions();
    };

    function renderTempOptions() {
      const box = document.getElementById("optionsBox");
      box.innerHTML = "";

      tempOptions.forEach((opt, index) => {
        box.innerHTML += `
          <div>
            ${index + 1}. ${opt.text}
            <button onclick="removeOption(${index})">Remove</button>
          </div>
        `;
      });
    }

    window.removeOption = function (index) {
      tempOptions.splice(index, 1);
      renderTempOptions();
    };

    window.saveQuestion = async function () {
      const questionInput = document.getElementById("questionInput");
      const questionText = questionInput.value.trim();

      if (!questionText) return alert("Enter a question.");
      if (tempOptions.length < 2) return alert("Add at least 2 options.");

      await addDoc(collection(db, "questions"), {
        question: questionText,
        options: tempOptions,
        createdAt: serverTimestamp()
      });

      questionInput.value = "";
      tempOptions = [];
      renderTempOptions();

      alert("Question saved.");
    };

    const q = query(collection(db, "questions"), orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
      const questionsDiv = document.getElementById("questions");
      const tallyDiv = document.getElementById("tally");

      questionsDiv.innerHTML = "";
      tallyDiv.innerHTML = "";

      if (snapshot.empty) {
        questionsDiv.innerHTML = "<p>No questions yet.</p>";
        tallyDiv.innerHTML = "<p>No votes yet.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const questionId = docSnap.id;

        tallyDiv.innerHTML += `
          <div class="card">
            <strong>${data.question}</strong>
            ${data.options.map(opt => `
              <div>${opt.text}: ${opt.votes} vote(s)</div>
            `).join("")}
          </div>
        `;

        questionsDiv.innerHTML += `
          <div class="card">
            <h2>${data.question}</h2>
            ${data.options.map((opt, index) => `
              <div class="option">
                <span>${opt.text}</span>
                <button onclick="vote('${questionId}', ${index})">Vote</button>
              </div>
            `).join("")}
          </div>
        `;
      });
    });

    window.vote = async function (questionId, optionIndex) {
      const ref = doc(db, "questions", questionId);

      const snapshot = await new Promise(resolve => {
        const unsubscribe = onSnapshot(ref, snap => {
          unsubscribe();
          resolve(snap);
        });
      });

      const data = snapshot.data();
      data.options[optionIndex].votes += 1;

      await updateDoc(ref, {
        options: data.options
      });
    };
  </script>

</body>
</html>
