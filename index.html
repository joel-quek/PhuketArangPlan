<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Decision Board</title>

  <!-- Firebase COMPAT (important) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; background:#f5f5f5; margin:0; }
    header { background:#111; color:white; padding:16px; }
    main { max-width:700px; margin:auto; padding:12px; }

    .card {
      background:white;
      padding:12px;
      margin-bottom:12px;
      border-radius:10px;
      border:1px solid #ddd;
    }

    input {
      width:100%;
      padding:8px;
      margin:6px 0;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button {
      padding:6px 10px;
      border:none;
      border-radius:999px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      margin:3px;
    }

    .admin { background:#7c3aed; }
    .delete { background:#dc2626; }

    .option {
      display:flex;
      justify-content:space-between;
      margin:6px 0;
      padding:8px;
      border:1px solid #eee;
      border-radius:6px;
      background:#fafafa;
    }

    .winner {
      background:#ecfdf5;
      padding:8px;
      border-radius:6px;
      margin-bottom:6px;
    }
  </style>
</head>

<body>
<header>
  <h2>Decision Board</h2>
</header>

<main>

  <div class="card">
    <h3>Winners</h3>
    <div id="winners"></div>
  </div>

  <div class="card">
    <h3>Admin</h3>

    <input id="pass" placeholder="passcode"/>
    <button class="admin" onclick="login()">Login</button>

    <div id="adminPanel" style="display:none;">
      <input id="newQ" placeholder="Add question"/>
      <button onclick="addQuestion()">Add Question</button>
    </div>
  </div>

  <div id="board"></div>

</main>

<script>
  // 🔴 PUT YOUR REAL CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const EVENT_ID = "decision-board";
  const PASS = "joel123";

  let isAdmin = false;

  function login() {
    if (document.getElementById("pass").value === PASS) {
      isAdmin = true;
      document.getElementById("adminPanel").style.display = "block";
    } else {
      alert("wrong pass");
    }
  }

  function qRef(id) {
    return db.collection("events").doc(EVENT_ID)
      .collection("questions").doc(id);
  }

  function optRef(q, o) {
    return qRef(q).collection("options").doc(o);
  }

  function addQuestion() {
    const text = document.getElementById("newQ").value.trim();
    if (!text) return;

    const id = Date.now().toString();

    qRef(id).set({
      text: text,
      order: Date.now()
    });

    document.getElementById("newQ").value = "";
  }

  function saveQuestion(id) {
    const val = document.getElementById("edit-" + id).value;

    qRef(id).update({
      text: val
    });
  }

  function deleteQuestion(id) {
    qRef(id).delete();
  }

  function addOption(qid) {
    const val = document.getElementById("opt-" + qid).value;
    if (!val) return;

    const id = Date.now().toString();

    optRef(qid, id).set({
      text: val,
      votes: 0
    });

    document.getElementById("opt-" + qid).value = "";
  }

  function vote(qid, oid) {
    const key = "vote_" + qid;

    if (localStorage.getItem(key)) {
      alert("already voted");
      return;
    }

    optRef(qid, oid).update({
      votes: firebase.firestore.FieldValue.increment(1)
    });

    localStorage.setItem(key, "1");
  }

  function render(questions, options) {
    const board = document.getElementById("board");
    const winners = document.getElementById("winners");

    board.innerHTML = "";
    winners.innerHTML = "";

    questions.sort((a,b)=>a.order-b.order);

    questions.forEach(q => {

      const opts = options[q.id] || [];

      // winner
      let top = null;
      opts.forEach(o=>{
        if (!top || o.votes > top.votes) top = o;
      });

      if (top) {
        winners.innerHTML += `
          <div class="winner">
            <b>${q.text}</b><br>
            ${top.text} (${top.votes})
          </div>
        `;
      }

      let html = `
        <div class="card">
          <h3>${q.text}</h3>
      `;

      opts.forEach(o=>{
        html += `
          <div class="option">
            ${o.text} (${o.votes})
            <button onclick="vote('${q.id}','${o.id}')">Vote</button>
          </div>
        `;
      });

      if (isAdmin) {
        html += `
          <input id="edit-${q.id}" value="${q.text}">
          <button onclick="saveQuestion('${q.id}')">Save</button>
          <button class="delete" onclick="deleteQuestion('${q.id}')">Delete</button>

          <hr>

          <input id="opt-${q.id}" placeholder="add option">
          <button onclick="addOption('${q.id}')">Add Option</button>
        `;
      }

      html += "</div>";
      board.innerHTML += html;
    });
  }

  function listen() {
    const qCol = db.collection("events").doc(EVENT_ID).collection("questions");

    qCol.onSnapshot(qSnap => {
      const questions = [];
      const options = {};

      qSnap.forEach(qDoc=>{
        const q = { id:qDoc.id, ...qDoc.data() };
        questions.push(q);

        qCol.doc(q.id).collection("options")
          .onSnapshot(oSnap=>{
            options[q.id] = [];
            oSnap.forEach(o=>{
              options[q.id].push({ id:o.id, ...o.data() });
            });
            render(questions, options);
          });
      });

      render(questions, options);
    });
  }

  listen();
</script>
</body>
</html>
